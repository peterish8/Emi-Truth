<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 120" role="img" aria-label="EMI Truth footer">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a3d2f"/>
      <stop offset="50%" stop-color="#16794b"/>
      <stop offset="100%" stop-color="#0f5c40"/>
    </linearGradient>
  </defs>

  <!-- Horizontal premium bar (different from centered profile footer) -->
  <rect width="900" height="120" rx="20" fill="#f8faf8" stroke="#cfd3cf" stroke-width="1"/>
  <rect x="1" y="1" width="898" height="118" rx="19" fill="url(#bar)"/>

  <!-- Logo left (inline vector) -->
  <rect x="24" y="16" width="88" height="88" rx="20" fill="#004d40" stroke="#b8f5d4" stroke-width="1.5" stroke-opacity="0.5"/>
  <g transform="translate(68, 60)" fill="none" stroke="#d8f5e4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-10 6h20" stroke-width="3.2"/>
    <path d="M-5 1v10" stroke-width="3.2"/>
    <path d="M0 1c6 0 11 5 11 11s-5 11-11 11" stroke-width="3.2"/>
    <path d="M7 19l7 7" stroke-width="3.2"/>
    <path d="M-10-6c0-5 4-9 9-9" stroke-width="3.2"/>
  </g>

  <!-- Copy center -->
  <text x="140" y="52" fill="#ffffff" font-family="Segoe UI, Manrope, system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.5">EMI Truth</text>
  <text x="140" y="76" fill="#b8f5d4" font-family="Segoe UI, Manrope, system-ui, sans-serif" font-size="12" font-weight="500">Small stories · Better money decisions</text>
  <text x="140" y="96" fill="#ffffff" font-family="Segoe UI, Manrope, sans-serif" font-size="10" font-weight="600" opacity="0.55">Educational only — not financial advice</text>

  <!-- CTA right -->
  <rect x="700" y="38" width="168" height="44" rx="12" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="784" y="58" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Manrope, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">VISIT SITE</text>
  <text x="784" y="74" text-anchor="middle" fill="#b8f5d4" font-family="ui-monospace, monospace" font-size="11" font-weight="700">emitruth.in</text>
</svg>
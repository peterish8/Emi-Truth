<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 128" role="img" aria-label="EMI Truth calculator breakdown">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d8f5c"/>
      <stop offset="100%" stop-color="#16794b"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b4f"/>
      <stop offset="100%" stop-color="#e84a2f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f3f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="#cfd3cf" stroke-width="1.5" stroke-linecap="round">
    <line x1="222" y1="64" x2="246" y2="64"/>
    <polygon points="246,60 254,64 246,68" fill="#656a66" stroke="none"/>
    <line x1="452" y1="64" x2="476" y2="64"/>
    <polygon points="476,60 484,64 476,68" fill="#e84a2f" stroke="none" opacity="0.7"/>
  </g>

  <!-- CASH -->
  <g transform="translate(16, 16)">
    <rect width="206" height="96" rx="18" fill="url(#card)" stroke="#111411" stroke-width="1.5"/>
    <text x="103" y="34" text-anchor="middle" fill="#656a66" font-family="Segoe UI, Manrope, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">CASH TODAY</text>
    <text x="103" y="68" text-anchor="middle" fill="#111411" font-family="Segoe UI, Manrope, sans-serif" font-size="28" font-weight="900">₹56,900</text>
    <text x="103" y="88" text-anchor="middle" fill="#656a66" font-family="Segoe UI, Manrope, sans-serif" font-size="9" font-weight="600">price − cash discount</text>
  </g>

  <!-- EMI TOTAL -->
  <g transform="translate(246, 16)">
    <rect width="206" height="96" rx="18" fill="url(#card)" stroke="rgba(22,121,75,0.35)" stroke-width="1.5"/>
    <rect x="1" y="1" width="204" height="94" rx="17" fill="#16794b" opacity="0.04"/>
    <text x="103" y="34" text-anchor="middle" fill="#16794b" font-family="Segoe UI, Manrope, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">EMI TOTAL</text>
    <text x="103" y="68" text-anchor="middle" fill="url(#g)" font-family="Segoe UI, Manrope, sans-serif" font-size="28" font-weight="900">₹58,412</text>
    <text x="103" y="88" text-anchor="middle" fill="#656a66" font-family="Segoe UI, Manrope, sans-serif" font-size="9" font-weight="600">principal + interest + GST + fees</text>
  </g>

  <!-- EXTRA -->
  <g transform="translate(476, 16)" filter="url(#glow)">
    <rect width="206" height="96" rx="18" fill="url(#card)" stroke="url(#r)" stroke-width="2"/>
    <rect x="2" y="2" width="202" height="92" rx="16" fill="#e84a2f" opacity="0.05"/>
    <text x="103" y="34" text-anchor="middle" fill="#e84a2f" font-family="Segoe UI, Manrope, sans-serif" font-size="10" font-weight="800" letter-spacing="1.4">EXTRA COST</text>
    <text x="103" y="68" text-anchor="middle" fill="url(#r)" font-family="Segoe UI, Manrope, sans-serif" font-size="28" font-weight="900">+₹1,512</text>
    <text x="103" y="88" text-anchor="middle" fill="#656a66" font-family="Segoe UI, Manrope, sans-serif" font-size="9" font-weight="600">the hidden no-cost gap</text>
    <circle cx="182" cy="24" r="3" fill="#e84a2f">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>